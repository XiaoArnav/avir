<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091410" />
      <stop offset="100%" stop-color="#020504" />
    </linearGradient>
    <linearGradient id="fav-airflow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="128" height="128" rx="32" fill="url(#fav-bg)" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.6" />
  
  <!-- Aerodynamic Airflow Waves -->
  <g transform="translate(16, 16) scale(2.4)">
    <path 
      d="M 6 12 C 14 12, 18 16, 26 16 C 31 16, 34 13, 34 10" 
      stroke="url(#fav-airflow)" 
      stroke-width="3.2" 
      stroke-linecap="round" 
      fill="none"
    />
    <path 
      d="M 6 20 C 12 20, 16 26, 24 26 C 30 26, 34 22, 34 18" 
      stroke="#ffffff" 
      stroke-width="3.2" 
      stroke-linecap="round" 
      fill="none"
    />
    <path 
      d="M 10 28 C 16 28, 20 32, 28 32 C 32 32, 34 30, 34 28" 
      stroke="url(#fav-airflow)" 
      stroke-width="2.8" 
      stroke-linecap="round" 
      stroke-opacity="0.85" 
      fill="none"
    />
    <circle cx="34" cy="10" r="2" fill="#34d399" />
  </g>
</svg>
