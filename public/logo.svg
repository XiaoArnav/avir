<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091410" />
      <stop offset="50%" stop-color="#040b08" />
      <stop offset="100%" stop-color="#020504" />
    </linearGradient>

    <!-- Glowing Specular Squircle Border -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Main Merged Glyph Gradient -->
    <linearGradient id="glyph-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Luminous Radial Atmosphere -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cupertino Squircle Enclosure (rx=112) -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg-canvas)" stroke="url(#border-glow)" stroke-width="3" />
  
  <!-- Ambient Atmosphere Halo -->
  <circle cx="256" cy="230" r="190" fill="url(#core-glow)" />

  <!-- Clean Aerodynamic Airflow Waves -->
  <g filter="url(#soft-glow)" transform="translate(68, 60) scale(9.5)">
    <!-- Stream 1 -->
    <path 
      d="M 6 12 C 14 12, 18 16, 26 16 C 31 16, 34 13, 34 10" 
      stroke="url(#glyph-grad)" 
      stroke-width="3.2" 
      stroke-linecap="round" 
      fill="none"
    />
    <!-- Central Stream -->
    <path 
      d="M 6 20 C 12 20, 16 26, 24 26 C 30 26, 34 22, 34 18" 
      stroke="#ffffff" 
      stroke-width="3.2" 
      stroke-linecap="round" 
      fill="none"
    />
    <!-- Base Stream -->
    <path 
      d="M 10 28 C 16 28, 20 32, 28 32 C 32 32, 34 30, 34 28" 
      stroke="url(#glyph-grad)" 
      stroke-width="2.8" 
      stroke-linecap="round" 
      stroke-opacity="0.85" 
      fill="none"
    />
    <circle cx="34" cy="10" r="2" fill="#34d399" />
  </g>

  <!-- Typographic Wordmark Below: AVIR -->
  <text 
    x="256" 
    y="440" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-size="34" 
    letter-spacing="10" 
    fill="#ffffff"
  >
    AVIR
  </text>
  <text 
    x="256" 
    y="468" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="500" 
    font-size="12" 
    letter-spacing="3" 
    fill="#10b981"
  >
    URBAN AIR QUALITY INTELLIGENCE
  </text>
</svg>
