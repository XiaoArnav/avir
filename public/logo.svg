<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="50%" stop-color="#05080f" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Specular Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Primary Atmospheric Wind Flow Gradient -->
    <linearGradient id="wind-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="wind-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Radial Atmospheric Ambient Glow -->
    <radialGradient id="ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="luminous-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Apple Squircle Canvas -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="3" />
  
  <!-- Ambient Atmospheric Glow Disc -->
  <circle cx="256" cy="256" r="220" fill="url(#ambient-glow)" />

  <!-- Stylized Hebrew א (Alef for אֲוִיר / Avir) merged into Aerodynamic Clean Air Currents -->
  <g filter="url(#luminous-filter)">
    <!-- Central Diagonal Transverse Wind Current (The Axis of the Alef) -->
    <path 
      d="M136 376 C 170 340, 220 280, 256 256 C 292 232, 342 172, 376 136 C 390 122, 404 126, 396 148 C 372 216, 280 320, 216 376 C 180 408, 118 396, 136 376 Z" 
      fill="url(#wind-emerald)" 
    />

    <!-- Upper-Right Atmospheric Flow (Upper Arm of Alef / Yod of Inspiration) -->
    <path 
      d="M256 220 C 270 170, 310 130, 360 120 C 388 114, 386 142, 364 164 C 330 198, 290 226, 256 220 Z" 
      fill="url(#wind-cyan)" 
    />

    <!-- Lower-Left Pulmonary Inhalation Ribbon (Lower Arm of Alef / Pure Breath) -->
    <path 
      d="M152 392 C 124 398, 126 370, 148 348 C 182 314, 222 286, 256 292 C 242 342, 202 382, 152 392 Z" 
      fill="url(#wind-cyan)" 
    />

    <!-- Dynamic Flow Rings / Clean Air Wavefronts -->
    <path 
      d="M168 180 C 210 148, 280 148, 332 176" 
      fill="none" 
      stroke="url(#wind-cyan)" 
      stroke-width="8" 
      stroke-linecap="round" 
      stroke-dasharray="1 16"
      opacity="0.6"
    />
    <path 
      d="M180 336 C 232 364, 302 364, 344 332" 
      fill="none" 
      stroke="url(#wind-emerald)" 
      stroke-width="8" 
      stroke-linecap="round" 
      stroke-dasharray="1 16"
      opacity="0.6"
    />

    <!-- Pure Air Node (Core Oxygen Particle) -->
    <circle cx="256" cy="256" r="14" fill="#ffffff" filter="url(#luminous-filter)" />
    <circle cx="256" cy="256" r="8" fill="#a7f3d0" />
  </g>

  <!-- Hebrew Typography: אֲוִיר (Avir) -->
  <text 
    x="256" 
    y="442" 
    text-anchor="middle" 
    fill="#ffffff" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" 
    font-size="34" 
    font-weight="800" 
    letter-spacing="6"
  >
    אֲוִיר
  </text>

  <!-- Subtitle Tag: AIR • ATMOSPHERE -->
  <text 
    x="256" 
    y="468" 
    text-anchor="middle" 
    fill="#34d399" 
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" 
    font-size="12" 
    font-weight="700" 
    letter-spacing="4"
    opacity="0.9"
  >
    AIR &bull; ATMOSPHERE
  </text>
</svg>
