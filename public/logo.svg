<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07131e" />
      <stop offset="50%" stop-color="#040911" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Specular Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Typography Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="40%" stop-color="#34d399" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Ambient Radial Atmospheric Glow -->
    <radialGradient id="glow-disc" cx="50%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Luminous Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Apple Squircle Outer Shell (rx=112) -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="3" />
  
  <!-- Ambient Atmospheric Light Disc -->
  <circle cx="256" cy="235" r="200" fill="url(#glow-disc)" />

  <!-- Surrounding Laminar Flow Accents -->
  <path 
    d="M 120 160 C 190 120, 320 120, 392 160" 
    fill="none" 
    stroke="#34d399" 
    stroke-width="5" 
    stroke-linecap="round" 
    opacity="0.4" 
    stroke-dasharray="2 18" 
  />
  <path 
    d="M 100 320 C 180 365, 330 365, 412 320" 
    fill="none" 
    stroke="#38bdf8" 
    stroke-width="5" 
    stroke-linecap="round" 
    opacity="0.4" 
    stroke-dasharray="2 18" 
  />

  <!-- Main Hero Hebrew Typography: אֲוִיר -->
  <text 
    x="256" 
    y="270" 
    text-anchor="middle" 
    fill="url(#text-grad)" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" 
    font-size="124" 
    font-weight="900" 
    letter-spacing="2"
    filter="url(#glow)"
  >
    אֲוִיר
  </text>

  <!-- Clean Sub-Label: AVIR • URBAN AIR QUALITY -->
  <text 
    x="256" 
    y="390" 
    text-anchor="middle" 
    fill="#f8fafc" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="22" 
    font-weight="800" 
    letter-spacing="8"
  >
    AVIR
  </text>
  
  <text 
    x="256" 
    y="420" 
    text-anchor="middle" 
    fill="#34d399" 
    font-family="ui-monospace, monospace" 
    font-size="13" 
    font-weight="700" 
    letter-spacing="4"
    opacity="0.9"
  >
    URBAN AIR QUALITY ASSISTANT
  </text>
</svg>
