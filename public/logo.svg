<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07131e" />
      <stop offset="50%" stop-color="#040a12" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Glowing Specular Squircle Border -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Main Merged Glyph Gradient -->
    <linearGradient id="glyph-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Accent Secondary Ribbon Gradient -->
    <linearGradient id="accent-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Luminous Radial Atmosphere -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cupertino Squircle Enclosure (rx=112) -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg-canvas)" stroke="url(#border-glow)" stroke-width="3" />
  
  <!-- Ambient Atmosphere Halo -->
  <circle cx="256" cy="256" r="210" fill="url(#core-glow)" />

  <!-- ======================================================== -->
  <!-- MERGED HEBREW LOGOMARK: אֲוִיר (Avir)                    -->
  <!-- The 4 characters (א, ו, י, ר) fused into an unbroken,     -->
  <!-- aerodynamic clean-air monogram                           -->
  <!-- ======================================================== -->
  <g filter="url(#soft-glow)">
    <!-- 1. The Resh (ר) Component: Outer Sheltering Atmospheric Arc -->
    <path 
      d="M 120 180 C 120 145, 150 120, 200 120 L 330 120 C 375 120, 400 145, 400 190 L 400 340 C 400 365, 385 375, 365 375 C 345 375, 335 365, 335 340 L 335 200 C 335 180, 320 170, 295 170 L 190 170 C 155 170, 135 185, 120 180 Z" 
      fill="url(#glyph-grad)" 
    />

    <!-- 2. The Alef (א) Central Dynamic Spine & Crossflow -->
    <path 
      d="M 130 380 C 110 395, 95 385, 105 365 L 235 190 C 245 175, 265 175, 275 190 L 305 235 C 315 250, 310 265, 295 275 L 165 380 C 155 388, 140 388, 130 380 Z" 
      fill="url(#accent-grad)" 
    />

    <!-- 3. The Vav (ו) Pillar: Descending Vertical Laminar Airflow -->
    <path 
      d="M 230 140 C 230 125, 245 115, 260 115 C 275 115, 290 125, 290 140 L 290 350 C 290 370, 275 385, 255 385 C 235 385, 220 370, 220 350 L 220 220 C 220 200, 230 160, 230 140 Z" 
      fill="url(#glyph-grad)" 
      opacity="0.9"
    />

    <!-- 4. The Yod (י) Particle: The Breath of Life Drop / Spark -->
    <path 
      d="M 315 150 C 315 138, 328 130, 342 135 C 362 142, 370 160, 365 180 C 360 198, 342 205, 330 198 C 318 190, 315 170, 315 150 Z" 
      fill="#ffffff" 
    />
    <circle cx="340" cy="165" r="7" fill="#6ee7b7" />

    <!-- 5. Left Arm of Alef / Lower Inhalation Wave -->
    <path 
      d="M 125 240 C 145 220, 185 220, 210 245 C 220 255, 220 270, 205 275 C 190 280, 175 270, 165 260 C 150 245, 135 250, 125 240 Z" 
      fill="url(#accent-grad)" 
    />

    <!-- 6. Vocalization (Niqqud) Accents: Symbolic Clean Particulate Rings -->
    <circle cx="160" cy="415" r="9" fill="#34d399" />
    <circle cx="190" cy="415" r="9" fill="#06b6d4" />
    <circle cx="220" cy="415" r="9" fill="#38bdf8" />
  </g>

  <!-- Typographic Wordmark Below: אֲוִיר • AVIR -->
  <text 
    x="256" 
    y="455" 
    text-anchor="middle" 
    fill="#ffffff" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" 
    font-size="28" 
    font-weight="900" 
    letter-spacing="5"
  >
    אֲוִיר • AVIR
  </text>
  
  <text 
    x="256" 
    y="480" 
    text-anchor="middle" 
    fill="#34d399" 
    font-family="ui-monospace, monospace" 
    font-size="11" 
    font-weight="700" 
    letter-spacing="4"
    opacity="0.85"
  >
    AIR • ATMOSPHERE
  </text>
</svg>
